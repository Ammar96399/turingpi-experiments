- name: Emulation preparation
  hosts: server
  become: true
  gather_facts: true
  roles:
    - role: emulation_preparation

- name: Manage results directory
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Clean results_dir
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: absent

    - name: Recreate results_dir
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"

