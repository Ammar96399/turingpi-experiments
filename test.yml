- name: Setup crd_creator
  hosts: server
  gather_facts: true
  roles:
    - role: crd_creator
  vars:
    reset_crd_creator: true

- name: Run hourly solar energy model
  hosts: localhost
  gather_facts: true
  roles:
    - role: solar_energy_model

- name: Prepare injecting workloads
  hosts: localhost
  gather_facts: true
  roles:
    - role: workloads_injector_prep
  vars:
    # observatory: "event_driven_observatory"
    # observatory: "long_term_observatory"
    observatory: "nepal_scenario"
    
- name: Start node control
  hosts: server
  gather_facts: true
  become: false
  roles:
    - role: node_control
  vars:
    window_size: 30
    min_threshold: 30
    max_threshold: 70

- name: Inject workload
  hosts: localhost
  gather_facts: true
  roles:
    - role: workloads_injector
  vars:
    # observatory: "event_driven_observatory"
    # observatory: "long_term_observatory"
    observatory: "nepal_scenario"