---
# Freeze experiment timestamp so results_dir and experiment_id stay consistent
- name: Set experiment timestamp
  hosts: all
  gather_facts: true
  tasks:
    - name: Compute run timestamp on localhost
      ansible.builtin.set_fact:
        run_timestamp: "{{ lookup('pipe', 'date +%y-%m-%d-%H-%M') }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Set experiment variables for all hosts
      ansible.builtin.set_fact:
        experiment_id: "{{ hostvars['localhost'].run_timestamp }}"
        results_dir: "{{ (results_dir | regex_replace('/[^/]+$','')) }}/{{ hostvars['localhost'].run_timestamp }}"

