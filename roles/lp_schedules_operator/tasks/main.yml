---
- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_installed

- name: Download Docker installation script
  ansible.builtin.get_url:
    url: https://test.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"
  when: not docker_installed.stat.exists

- name: Execute Docker installation script
  ansible.builtin.command:
    cmd: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
  when: not docker_installed.stat.exists
  register: docker_install_result
  changed_when: docker_install_result.rc == 0

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: not docker_installed.stat.exists

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: not docker_installed.stat.exists

- name: Delete the lp_schedules_operator build directory if exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules_operator
    state: absent

- name: Create the lp_schedules_operator build directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules_operator
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Copy the operator.py script
  ansible.builtin.copy:
    src: operator.py
    dest: "/home/{{ ansible_user }}/lp_schedules_operator"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the requirements file
  ansible.builtin.copy:
    src: requirements.txt
    dest: "/home/{{ ansible_user }}/lp_schedules_operator"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "/home/{{ ansible_user }}/lp_schedules_operator"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Remove docker image
  ansible.builtin.command: sudo docker image rm lp-schedules-operator:local
  ignore_errors: true

- name: Build the docker image
  community.docker.docker_image:
    build:
      path: /home/{{ ansible_user }}/lp_schedules_operator
      nocache: true
    name: lp-schedules-operator
    source: build
    tag: local

- name: Check if the docker image tar file exists
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/lp_schedules_operator/lp-schedules-operator.tar
  register: docker_image_tar

- name: Delete the docker image tar file
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules_operator/lp-schedules-operator.tar
    state: absent
  when: docker_image_tar.stat.exists

- name: Save the docker image to a tar file
  ansible.builtin.shell: |
    docker save lp-schedules-operator:local > /home/{{ ansible_user }}/lp_schedules_operator/lp-schedules-operator.tar

- name: Remove the docker image from the master node
  ansible.builtin.command: sudo k0s ctr images rm docker.io/library/lp-schedules-operator:local
  ignore_errors: true

- name: Import the docker image to the master node
  ansible.builtin.command: sudo k0s ctr images import /home/{{ ansible_user }}/lp_schedules_operator/lp-schedules-operator.tar

- name: Ensure lp_schedules_operator namespace exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    create namespace lp-schedules-operator
  ignore_errors: true
  changed_when: false

- name: Delete lp-schedules-operator deployment if it exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    delete deployment lp-schedules-operator
    -n lp-schedules-operator
  ignore_errors: true
  changed_when: false

- name: Create lp_schedules_operator CRD manifest
  ansible.builtin.template:
    src: crd.yaml.j2
    dest: /tmp/lp-schedules-crd.yaml
    mode: "0644"

- name: Apply lp_schedules_operator CRD
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    apply -f /tmp/lp-schedules-crd.yaml

- name: Create lp_schedules_operator Kubernetes deployment manifest
  ansible.builtin.template:
    src: deployment.yaml.j2
    dest: /tmp/lp-schedules-operator-deployment.yaml
    mode: "0644"

- name: Deploy lp-schedules-operator to Kubernetes
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    apply -f /tmp/lp-schedules-operator-deployment.yaml

- name: Wait for lp-schedules-operator deployment to be ready
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    -n lp-schedules-operator
    wait --for=condition=available
    --timeout=300s
    deployment/lp-schedules-operator
  changed_when: false
