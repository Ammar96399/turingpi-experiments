---
- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_installed

- name: Download Docker installation script
  ansible.builtin.get_url:
    url: https://test.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"
  when: not docker_installed.stat.exists

- name: Execute Docker installation script
  ansible.builtin.command:
    cmd: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
  when: not docker_installed.stat.exists
  register: docker_install_result
  changed_when: docker_install_result.rc == 0

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create the get_limit build directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/get_limit
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Delete the get_limit build directory if exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/get_limit
    state: absent

- name: Recreate the get_limit build directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/get_limit
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Copy the workloads configuration file to simulation directory
  ansible.builtin.copy:
    src: "/home/akazem/Documents/PhD/projects/energy_proportionality/cluster_configuration/turing_pi_emulation/roles/workloads_injector/files/nepal_scenario/configs/workloads_configuration.yml"
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation/workloads_configuration.yml"
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the workloads configuration file to build directory
  ansible.builtin.copy:
    src: "/home/akazem/Documents/PhD/projects/energy_proportionality/cluster_configuration/turing_pi_emulation/roles/workloads_injector/files/nepal_scenario/configs/workloads_configuration.yml"
    dest: "/home/{{ ansible_user }}/get_limit/workloads_configuration.yml"
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the get_limit script
  ansible.builtin.copy:
    src: get_limit.py
    dest: "/home/{{ ansible_user }}/get_limit"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the requirements file
  ansible.builtin.copy:
    src: requirements.txt
    dest: "/home/{{ ansible_user }}/get_limit"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "/home/{{ ansible_user }}/get_limit"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Remove docker image
  ansible.builtin.command: sudo docker image rm get-limit:local
  ignore_errors: true

- name: Build the docker image
  community.docker.docker_image:
    build:
      path: /home/{{ ansible_user }}/get_limit
      nocache: true
    name: get-limit
    source: build
    tag: local

- name: Check if the docker image tar file exists
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/get_limit/get-limit.tar
  register: docker_image_tar

- name: Delete the docker image tar file
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/get_limit/get-limit.tar
    state: absent
  when: docker_image_tar.stat.exists

- name: Save the docker image to a tar file
  ansible.builtin.shell: |
    docker save get-limit:local > /home/{{ ansible_user }}/get_limit/get-limit.tar

- name: Remove the docker image from the master node
  ansible.builtin.command: sudo k0s ctr images rm docker.io/library/get-limit:local
  ignore_errors: true

- name: Import the docker image to the master node
  ansible.builtin.command: sudo k0s ctr images import /home/{{ ansible_user }}/get_limit/get-limit.tar

- name: Ensure lp-schedules-operator namespace exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    create namespace lp-schedules-operator
  ignore_errors: true
  changed_when: false

- name: Delete get-limit deployment if it exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    delete deployment get-limit
    -n lp-schedules-operator
  ignore_errors: true
  changed_when: false

- name: Create or update get-limit configmap
  ansible.builtin.shell: |
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }} create configmap get-limit-config \
      --from-file=workloads_configuration.yml=/home/{{ ansible_user }}/simulation/{{ workload }}_simulation/workloads_configuration.yml \
      -n lp-schedules-operator --dry-run=client -o yaml | \
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f -

- name: Deploy get-limit to Kubernetes
  ansible.builtin.shell: |
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f - <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: get-limit
      namespace: lp-schedules-operator
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: get-limit
      template:
        metadata:
          labels:
            app: get-limit
        spec:
          nodeSelector:
            role: server
          containers:
            - name: get-limit
              image: docker.io/library/get-limit:local
              imagePullPolicy: Never
              ports:
                - containerPort: 49091
              volumeMounts:
                - name: workloads-config
                  mountPath: /app/workloads_configuration.yml
                  subPath: workloads_configuration.yml
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "25m"
                limits:
                  memory: "128Mi"
                  cpu: "250m"
          volumes:
            - name: workloads-config
              configMap:
                name: get-limit-config
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: get-limit
      namespace: lp-schedules-operator
    spec:
      selector:
        app: get-limit
      ports:
        - name: http
          port: 49091
          targetPort: 49091
      type: ClusterIP
    EOF

- name: Wait for get-limit deployment to be ready
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    -n lp-schedules-operator
    wait --for=condition=available
    --timeout=300s
    deployment/get-limit
  changed_when: false
