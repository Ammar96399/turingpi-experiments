---
- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_installed

- name: Download Docker installation script
  ansible.builtin.get_url:
    url: https://test.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"
  when: not docker_installed.stat.exists

- name: Execute Docker installation script
  ansible.builtin.command:
    cmd: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
  when: not docker_installed.stat.exists
  register: docker_install_result
  changed_when: docker_install_result.rc == 0

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: not docker_installed.stat.exists

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: not docker_installed.stat.exists

- name: Create the lp_schedules build directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Delete the lp_schedules build directory if exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules
    state: absent

- name: Create the lp_schedules build directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Copy the linear_program.py script
  ansible.builtin.copy:
    src: linear_program.py
    dest: "/home/{{ ansible_user }}/lp_schedules"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the requirements file
  ansible.builtin.copy:
    src: requirements.txt
    dest: "/home/{{ ansible_user }}/lp_schedules"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "/home/{{ ansible_user }}/lp_schedules"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Remove docker image
  ansible.builtin.command: sudo docker image rm linear-program:local
  ignore_errors: true

- name: Build the docker image
  community.docker.docker_image:
    build:
      path: /home/{{ ansible_user }}/lp_schedules
      nocache: true
    name: linear-program
    source: build
    tag: local

- name: Check if the docker image tar file exists
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/lp_schedules/linear-program.tar
  register: docker_image_tar

- name: Delete the docker image tar file
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/lp_schedules/linear-program.tar
    state: absent
  when: docker_image_tar.stat.exists

- name: Save the docker image to a tar file
  ansible.builtin.shell: |
    docker save linear-program:local > /home/{{ ansible_user }}/lp_schedules/linear-program.tar

- name: Remove the docker image from the master node
  ansible.builtin.command: sudo k0s ctr images rm docker.io/library/linear-program:local
  ignore_errors: true

- name: Import the docker image to the master node
  ansible.builtin.command: sudo k0s ctr images import /home/{{ ansible_user }}/lp_schedules/linear-program.tar

- name: Ensure lp_schedules namespace exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    create namespace lp-schedules
  ignore_errors: true
  changed_when: false

- name: Delete linear-program deployment if it exists
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    delete deployment linear-program
    -n lp-schedules
  ignore_errors: true
  changed_when: false

- name: Create lp_schedules Kubernetes deployment manifest
  ansible.builtin.template:
    src: deployment.yaml.j2
    dest: /tmp/lp-schedules-deployment.yaml
    mode: "0644"

- name: Deploy linear-program to Kubernetes
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    apply -f /tmp/lp-schedules-deployment.yaml

- name: Wait for linear-program deployment to be ready
  ansible.builtin.command: >
    k0s kubectl --kubeconfig {{ k3s_kubeconfig }}
    -n lp-schedules
    wait --for=condition=available
    --timeout=300s
    deployment/linear-program
  changed_when: false
