apiVersion: graceful-degradation.io/v0
kind: LPSchedule
metadata:
  name: flood-detection-optimization
spec:
  e_sol_wh: 1201
  soc_init_wh: 100
  gamma: 0.5
  objective_type: "weighted_level_sum"
  applications:
    "App A":
      index: 1
      weight: 1
      critical: 1
      levels:
        - level: 1
          cost: 1
          dep: []
        - level: 2
          cost: 30
          dep: [{ "1": "1" }]
    "App B":
      index: 2
      weight: 1
      critical: 1
      levels:
        - level: 1
          cost: 5
          dep: [{ "1": "1" }]
    "App C":
      index: 3
      weight: 2
      critical: 1
      levels:
        - level: 1
          cost: 5
          dep: [{ "2": "1" }]
        - level: 2
          cost: 10
          dep: [{ "2": "1" }]
        - level: 3
          cost: 40
          dep: [{ "2": "1" }]
    "App D":
      index: 4
      weight: 1
      critical: 1
      levels:
        - level: 1
          cost: 10
          dep: [{ "3": "*" }]
        - level: 2
          cost: 20
          dep: [{ "4": "1" }]
        - level: 3
          cost: 25
          dep: [{ "4": "1" }]
        - level: 4
          cost: 30
          dep: [{ "4": "1" }]
        - level: 5
          cost: 35
          dep: [{ "4": "1" }]
    "App E":
      index: 5
      weight: 5
      critical: 1
      levels:
        - level: 1
          cost: 5
          dep: [{ "3": "*" }]
        - level: 2
          cost: 10
          dep: [{ "3": "*", "5": 1 }]
        - level: 3
          cost: 30
          dep: [{ "3": "*", "5": 2 }]
        - level: 4
          cost: 150
          dep: [{ "3": "*", "5": 3 }]
        - level: 5
          cost: 200
          dep: [{ "3": "*", "5": 4 }]
    "App F":
      index: 6
      weight: 10
      critical: 1
      levels:
        - level: 1
          cost: 10
          dep: [{ "5": "*" }]
        - level: 2
          cost: 15
          dep: [{ "5": "*", "6": 1 }]
        - level: 3
          cost: 30
          dep: [{ "5": "*", "6": 2 }]
        - level: 4
          cost: 50
          dep: [{ "5": "*", "6": 3 }]
        - level: 5
          cost: 200
          dep: [{ "5": "*", "6": 4 }]
        - level: 6
          cost: 200
          dep: [{ "5": "*", "6": 5 }]
        - level: 7
          cost: 200
          dep: [{ "5": "*", "6": 5, "6": 6 }]
