---
- name: Ensure k0s config directory exists
  ansible.builtin.file:
    path: "{{ k0s_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Write the k0s token file on worker
  no_log: true
  ansible.builtin.template:
    src: worker-token.j2
    dest: "{{ k0s_config_dir }}/worker-token"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create k0s worker service with install command
  register: install_worker_cmd
  ansible.builtin.command: k0s install worker --token-file {{ k0s_config_dir }}/worker-token --labels="{{ label }}"
  args:
    creates: /etc/systemd/system/k0sworker.service
  changed_when: install_worker_cmd | length > 0

- name: Enable and check k0s service
  become: true
  ansible.builtin.systemd:
    name: k0sworker
    daemon_reload: true
    state: restarted
    enabled: true
