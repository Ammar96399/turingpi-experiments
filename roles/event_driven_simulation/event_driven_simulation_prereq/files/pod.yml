apiVersion: batch/v1
kind: Job
metadata:
  name: load-injector
spec:
  ttlSecondsAfterFinished: 10
  backoffLimit: 6
  template:
    spec:
      containers:
        - name: load-injector
          image: docker.io/library/long-term-load-injector:local
          args: ["${WORKLOAD_NUMBER}", "${MODEL}"]
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "0"
            limits:
              cpu: "1"
      restartPolicy: OnFailure
