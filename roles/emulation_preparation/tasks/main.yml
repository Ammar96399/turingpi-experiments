- name: Ping nodes to check if they are reachable
  ansible.builtin.ping:
    data: "pong"
  loop:
    - rk1-1
    - cm4-0
  register: ping_result
  failed_when: ping_result.failed

- name: Uncordon nodes
  ansible.builtin.shell: |
    k0s kubectl uncordon rk1-1
    k0s kubectl uncordon cm4-0
  register: uncordon_result
  failed_when: uncordon_result.rc != 0
  changed_when: uncordon_result.rc == 0
  become: true
