---
- name: Emulation preparation
  hosts: server
  gather_facts: true
  roles:
    - role: emulation_preparation

- name: Setup monitoring
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: monitoring

- name: Prepare long term simulation
  hosts: turing_pi_cluster
  gather_facts: true
  become: true
  roles:
    - role: deploy_applications_prereq

- name: Start system measurements
  hosts: localhost
  gather_facts: true
  roles:
    - role: system_measurements

- name: Prepare injecting workloads
  hosts: localhost
  gather_facts: true
  roles:
    - role: workloads_injector_prep
  vars:
    # observatory: "event_driven_observatory"
    observatory: "long_term_observatory"

- name: Run event_driven_observatory simulation
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: deploy_applications
  vars:
    # observatory: "event_driven_observatory"
    observatory: "long_term_observatory"

- name: Inject workload
  hosts: localhost
  gather_facts: true
  roles:
    - role: workloads_injector
  vars:
    # observatory: "event_driven_observatory"
    observatory: "long_term_observatory"

- name: Start node control
  hosts: server
  gather_facts: true
  become: false
  roles:
    - role: node_control
  vars:
    window_size: 15
    min_threshold: 40
    max_threshold: 70
